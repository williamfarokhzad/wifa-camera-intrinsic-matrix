64" class="number" text-anchor="middle">2</text><path d="M565 313v22" stroke="#345d66" stroke-width="2"/><text x="565" y="364" class="number" text-anchor="middle">3</text><path d="M650 313v22" stroke="#345d66" stroke-width="2"/><text x="650" y="364" class="number" text-anchor="middle">4</text><path d="M735 313v22" stroke="#345d66" stroke-width="2"/><text x="735" y="364" class="number" text-anchor="middle">5</text><circle cx="352.50" cy="324.00" r="7" fill="#b93237" stroke="#fff" stroke-width="2"/><text x="352.5" y="297" class="number" text-anchor="middle">0.5</text><circle cx="522.50" cy="324.00" r="7" fill="#b93237" stroke="#fff" stroke-width="2"/><text x="522.5" y="297" class="number" text-anchor="middle">2.5</text><circle cx="692.50" cy="324.00" r="7" fill="#b93237" stroke="#fff" stroke-width="2"/><text x="692.5" y="297" class="number" text-anchor="middle">4.5</text><text x="44" y="437" class="small" text-anchor="start">Red marks: where source centers 0, 1 and 2 land.</text>
